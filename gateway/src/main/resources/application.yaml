spring:
  application:
    name: gateway
  config:
    import: classpath:platform-defaults.yaml

server:
  port: 8080

management:
  server:
    port: 9080

# Checked by the startup guard; the service refuses to start in production without these.
vitrin:
  guard:
    required-in-production:
      - vitrin.site.origin
    required-files-in-production:
      - vitrin.ratelimit.address-hash-key-file

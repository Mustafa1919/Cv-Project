# Runtime defaults shared by every service. Each service imports this file from its
# application.yaml; environment variables still override anything set here.

server:
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  # Nothing is exported unless the deployment points the service at a collector:
  #   MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true
  #   MANAGEMENT_OTLP_METRICS_EXPORT_URL=http://<collector>:4318/v1/metrics
  #   MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://<collector>:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

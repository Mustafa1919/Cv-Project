name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows and shell scripts
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            "$ACTIONLINT_IMAGE"

          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find deploy -type f -name '*.sh' -print0)
          if [[ -f .githooks/pre-commit ]]; then
            files+=(".githooks/pre-commit")
          fi
          if (( ${#files[@]} == 0 )); then
            echo "No shell scripts found." >&2
            exit 1
          fi

          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            "$SHELLCHECK_IMAGE" "${files[@]}"

      - name: Check production Compose constraints
        run: bash deploy/prod/check-compose.sh

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan complete Git history
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            "$GITLEAKS_IMAGE" git --redact --no-banner \
            --log-opts="--all" --config /repo/.gitleaks.toml /repo

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Record job start
        run: touch "$RUNNER_TEMP/backend-start"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build and execute every test
        run: ./gradlew build --no-build-cache --rerun-tasks --no-configuration-cache

      - name: Require fresh test results from every module
        run: |
          for module in platform gateway core search; do
            directory="$module/build/test-results/test"
            if [[ ! -d "$directory" ]]; then
              echo "Missing test results for $module." >&2
              exit 1
            fi
            result="$(find "$directory" -type f -name 'TEST-*.xml' \
              -newer "$RUNNER_TEMP/backend-start" -print -quit)"
            if [[ -z "$result" ]]; then
              echo "No fresh test results for $module." >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-jars
          path: |
            gateway/build/libs/gateway.jar
            core/build/libs/core.jar
            search/build/libs/search.jar
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-test-reports
          path: |
            **/build/test-results/
            **/build/reports/tests/
          retention-days: 7

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Check content tool
        working-directory: content/tool
        run: |
          npm run typecheck
          npm test

      - name: Validate real content when available
        run: |
          if [[ -f content/profile.yaml ]]; then
            (cd content/tool && npm run check)
          fi

      - name: Install Chromium and system dependencies
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Check and test the site
        working-directory: site
        run: |
          npm run typecheck
          npm test

      - name: Enforce Lighthouse budgets
        working-directory: site
        run: npx --no-install lhci autorun

      - name: Scan npm dependencies
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            -v vitrin-trivy-cache:/root/.cache/ \
            "$TRIVY_IMAGE" fs --exit-code 1 \
            --severity CRITICAL,HIGH --scanners vuln /repo

      - name: Build publishable site
        if: github.ref == 'refs/heads/main' && vars.SITE_ORIGIN != ''
        working-directory: site
        env:
          VITRIN_SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          PUBLIC_VITRIN_API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          if [[ -f ../content/profile.yaml ]]; then
            export VITRIN_CONTENT_DIR=../content
          fi
          npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main' && vars.SITE_ORIGIN != ''
        with:
          name: site-dist
          path: site/dist
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: site-test-results
          path: site/test-results
          retention-days: 7

  images:
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        name: [gateway, core, search, migrate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.name != 'migrate'
        with:
          name: service-jars
          path: .

      - name: Prepare image metadata
        id: metadata
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          owner="${OWNER,,}"
          image="ghcr.io/$owner/vitrin-$IMAGE_NAME"
          {
            echo "image=$image"
            echo "tag=$image:$REVISION"
            echo "revision=$REVISION"
            echo "source=$SERVER_URL/$REPOSITORY"
          } >> "$GITHUB_OUTPUT"

      - name: Build image without external caches
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
          REVISION: ${{ steps.metadata.outputs.revision }}
          SOURCE: ${{ steps.metadata.outputs.source }}
        run: |
          if [[ "$IMAGE_NAME" == migrate ]]; then
            docker build \
              -f deploy/docker/migrate.Dockerfile \
              --build-arg "REVISION=$REVISION" \
              --build-arg "SOURCE=$SOURCE" \
              -t "$IMAGE_TAG" deploy/postgres
          else
            docker build \
              -f deploy/docker/service.Dockerfile \
              --build-arg "SERVICE=$IMAGE_NAME" \
              --build-arg "REVISION=$REVISION" \
              --build-arg "SOURCE=$SOURCE" \
              -t "$IMAGE_TAG" "$IMAGE_NAME/build/libs"
          fi

      - name: Scan image vulnerabilities
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/repo" -w /repo \
            -v vitrin-trivy-cache:/root/.cache/ \
            "$TRIVY_IMAGE" image --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignorefile /repo/.trivyignore.yaml \
            --scanners vuln "$IMAGE_TAG"

      - name: Generate CycloneDX SBOM
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/repo" -w /repo \
            -v vitrin-trivy-cache:/root/.cache/ \
            "$TRIVY_IMAGE" image --format cyclonedx \
            --output /repo/sbom.json "$IMAGE_TAG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}
          path: sbom.json
          retention-days: 7
          if-no-files-found: error

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image and resolve registry digest
        id: pushed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          docker push "$IMAGE_TAG"
          reference="$(docker image inspect \
            --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")"
          if [[ "$reference" != "$IMAGE@sha256:"* ]]; then
            echo "Unexpected pushed image reference: $reference" >&2
            exit 1
          fi
          digest="${reference##*@}"
          {
            echo "reference=$reference"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Sign image and attest SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REFERENCE: ${{ steps.pushed.outputs.reference }}
        run: |
          cosign sign --yes "$IMAGE_REFERENCE"
          cosign attest --yes --type cyclonedx \
            --predicate sbom.json "$IMAGE_REFERENCE"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.pushed.outputs.digest }}
          push-to-registry: true

  gate:
    needs: [lint, secrets, backend, site, images]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["NEEDS_JSON"])
          failed = False
          for name, job in jobs.items():
              result = job["result"]
              print(f"{name}: {result}")
              if result != "success":
                  failed = True
          sys.exit(1 if failed else 0)
          PY

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      # No rules are defined; Loki 3.7 still refuses to start without this directory.
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: ${VITRIN_LOGS_RETENTION:-168h}
  # Retention alone does not bound ingestion-driven disk growth.
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  max_line_size: 64KB
  allow_structured_metadata: true
  volume_enabled: true

analytics:
  reporting_enabled: false

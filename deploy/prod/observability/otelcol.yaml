receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Leave headroom for queues and the collector runtime.
  memory_limiter:
    check_interval: 1s
    limit_mib: 180
    spike_limit_mib: 40
  batch: {}

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    sending_queue:
      queue_size: 512
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    sending_queue:
      queue_size: 512
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      queue_size: 512

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]

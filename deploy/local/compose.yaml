# Local dependencies only. The three services run from Gradle (see the README).
# Ports are bound to localhost; the credentials below are for this machine and nothing else.
# If a port is taken (a PostgreSQL installed on the machine holds 5432), set VITRIN_POSTGRES_PORT
# or VITRIN_REDIS_PORT before starting.
name: vitrin-local

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: vitrin
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: vitrin
    ports:
      - "127.0.0.1:${VITRIN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrin -d vitrin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    # Counters must never be evicted silently; refuse writes when memory is full instead.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${VITRIN_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
